// ==============================================
// CONTROLES PRINCIPALES
// ==============================================

bind "F8" "toggleconsole"     // Abrir consola

bind "1" "slot1"             // Arma principal

bind "2" "slot2"             // Pistola

bind "3" "slot3"             // Cuchillo

bind "mouse1" "+attack"      // Disparar

bind "mouse2" "+attack2"     // Disparo secundario

bind "r" "+reload"           // Recargar

bind "e" "+use"              // Usar / plantar / defuse

bind "g" "drop"              // Soltar arma

bind "f" "+lookatweapon"     // Inspeccionar arma

bind "shift" "+sprint"       // Caminar

bind "tab" "+showscores"     // Ver marcador

bind "y" "messagemode"       // Chat global

bind "u" "messagemode2"      // Chat de equipo

bind "," "buy vest"          // Comprar chaleco

bind "b" "buymenu"           // Abrir menú de compra

alias "+radarzoom" "cl_radar_scale 0.8"

alias "-radarzoom" "cl_radar_scale 0.43"

bind "alt" "+radarzoom"

bind "F10" "say ¯\_(ツ)_/¯"   // Mensaje troll

bind "mouse4" "slot7"   // Flashbang

bind "mouse5" "slot8"   // Smoke


bind "c" "slot7"             // Flash

bind "v" "slot8"             // Smoke

bind "CAPSLOCK" "+voicerecord"    // Push to talk

bind "h" "switchhands" // Cambiar de mano el arma

bind "X" "slot5" // C4

bind "MOUSE3" "player_ping" // Ping con el ratón


alias d "disconnect" // Desconectar del servidor

alias q "quit" // Salir del juego

alias c "clear" // Limpiar consola

alias w "map_workshop 3086023598 5e_aimhub" // Cargar mapa de workshop 5e_aimhub

alias w2 "map_workshop 3105821815" // Cargar mapa de workshop aim_training