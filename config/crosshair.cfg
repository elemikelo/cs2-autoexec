// ==============================================
// CONFIGURACIÓN DE MIRA
// ==============================================

cl_crosshaircolor 1      // Activa el modo de color personalizado para el crosshair (1 verde, 2 amarillo, 3 azul, 4 personalizado)

cl_crosshaircolor_r 50    // Valor rojo (255 = sin rojo)

cl_crosshaircolor_g 250  // Valor verde (255 = verde máximo)

cl_crosshaircolor_b 50    // Valor azul (0 = sin azul)

cl_crosshairsize 2           // Tamaño de la mira

cl_crosshairthickness 0    // Grosor de las líneas

cl_crosshairgap -2.0          // Espacio central entre líneas

cl_crosshairdot 0            // Desactiva punto central

cl_crosshair_drawoutline 1   // Desactiva contorno

cl_crosshairalpha 255        // Opacidad máxima

cl_crosshairusealpha 1       // Permite transparencia

cl_crosshair_t 0             // Forma clásica

cl_crosshair_recoil 0        // No mostrar recoil en la mira

cl_crosshair_sniper_width 1  // Grosor de la mira sniper

cl_crosshairgap_useweaponvalue 0 // Desactiva gap dinámico según arma

cl_crosshair_dynamic_maxdist_splitratio  0.3   // Distancia máxima de split dinámico  

cl_crosshair_dynamic_splitalpha_innermod 1    // Transparencia del split interno

cl_crosshair_dynamic_splitalpha_outermod 0.5  // Transparencia del split externo

cl_crosshair_dynamic_splitdist 7      // Distancia de split dinámico

cl_crosshair_friendly_warning 1    // Muestra advertencia de enemigos en la mira

cl_crosshair_outlinethickness  0.5  // Grosor del contorno de la mira

cl_crosshairstyle 4 // Estilo de mira (0 = clásica, 1 = dinámica, 2 = estática, 3 = híbrida, 4 = híbrida con split dinámico)    
  